<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cost Factory: Topic 2 Cost Accounting Game</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5b6b79;--line:#cfd7de;--steel:#2f5d7c;--amber:#f2a900;--ok:#1e8e5a;--okbg:#dff3e8;--bad:#c8412f;--badbg:#fae3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101820;--card:#1a2631;--ink:#eaf0f5;--mute:#9db0bf;--line:#33454f;--steel:#6fa8cf;--okbg:#17382a;--badbg:#401e19;--ok:#4cc88a;--bad:#ff8a77}}
:root[data-theme="dark"]{--bg:#101820;--card:#1a2631;--ink:#eaf0f5;--mute:#9db0bf;--line:#33454f;--steel:#6fa8cf;--okbg:#17382a;--badbg:#401e19;--ok:#4cc88a;--bad:#ff8a77}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px}
h1,h2,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0;letter-spacing:.2px}
h1{font-size:44px;line-height:1}h2{font-size:28px}
.sub{color:var(--mute);margin:8px 0 20px}
.lv{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.lv:active{border-color:var(--steel)}
.lv b{font-family:"Barlow Condensed",sans-serif;font-size:22px;display:block}
.lv span.n{font-family:"Barlow Condensed",sans-serif;font-size:34px;color:var(--amber);min-width:30px}
.lv small{color:var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--steel);transition:width .3s}
.belt{background:var(--card);border:2px solid var(--line);border-bottom:8px solid var(--steel);border-radius:10px;padding:20px 16px;min-height:120px;font-size:20px;font-weight:500}
.belt .amt{display:inline-block;margin-top:8px;font-family:"Barlow Condensed",sans-serif;font-size:26px;color:var(--steel)}
.opts{display:grid;gap:10px;margin-top:16px}
.o{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:14px;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.o:focus-visible,.lv:focus-visible,.go:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.o.ok{background:var(--okbg);border-color:var(--ok)}.o.no{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.go{margin-top:14px;width:100%;background:var(--amber);color:#14202b;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.big{font-size:64px;color:var(--amber);line-height:1}
.ref{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;font-size:14px}
.ref table{width:100%;border-collapse:collapse}.ref td{padding:2px 0}.ref td:last-child{text-align:right}
.credit{margin-top:24px;padding:14px;background:var(--card);border:2px solid var(--line);border-left:5px solid var(--amber);border-radius:10px;font-size:13px;color:var(--mute);line-height:1.5}
.credit strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--steel);margin-bottom:4px}
.credit span{display:block;color:var(--ink);font-weight:600}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>"RM"+n.toLocaleString("en-US");
const C4=["Direct materials","Direct labour","Manufacturing overhead","Non-manufacturing cost"];
// name, amount, category index, reason
const IT=[
["Factory equipment rent",1500,2,"It is an indirect cost of running the factory, so it is manufacturing overhead."],
["Factory building insurance",500,2,"Insurance on the factory is an indirect manufacturing cost."],
["Timber used to make tables",200000,0,"Primary materials directly used in production are direct materials."],
["Factory utilities",800,2,"Factory utilities are indirect, so they are manufacturing overhead."],
["Office supplies",400,3,"Office costs relate to administration, so they are non-manufacturing."],
["Assembly line wages",70000,1,"Wages of workers who convert materials into finished goods are direct labour."],
["Depreciation on office equipment",400,3,"Office depreciation is an administrative cost: non-manufacturing."],
["Indirect materials",10000,2,"Materials that cannot be traced to a product go into manufacturing overhead."],
["Factory property taxes",125,2,"Factory taxes are an indirect factory cost: overhead."],
["Factory supervisory salaries",1700,2,"Supervisors do not convert materials themselves, so this is overhead, not direct labour."],
["Advertising",1250,3,"Advertising is a selling expense: non-manufacturing."],
["Sales commission",80000,3,"Selling costs are non-manufacturing, however large the amount."],
["Depreciation on factory building",900,2,"Factory depreciation is an indirect manufacturing cost: overhead."]];
const L1=sh(IT).map(x=>({q:`Classify this cost:<br><b>${x[0]}</b><br><span class="amt">${fmt(x[1])}</span>`,o:C4,a:C4[x[2]],w:x[3]}));
const L2=sh(IT).map(x=>{const p=x[2]<3;return{q:`Is this a product cost or a period cost?<br><b>${x[0]}</b><br><span class="amt">${fmt(x[1])}</span>`,o:["Product cost","Period cost"],a:p?"Product cost":"Period cost",w:p?"Manufacturing costs are product costs. They are reported in the Statement of Cost of Goods Manufactured.":"Non-manufacturing costs are period costs. They are reported in the Statement of Profit or Loss."}});
const Q=(q,a,o,w)=>({q,a,o:[a,...o],w});
const L3=[
Q("Buying machinery that will give benefits in future years is a…","Cost (capitalised as an asset)",["Expense","Period cost","Selling expense"],"A cost buys future economic benefits. An expense gives benefits in the current period."),
Q("Which of these is an expense?","Advertising",["Purchase of machinery","Purchase of equipment","Factory building purchase"],"Utilities, salaries and advertising are expenses: benefits are used up in the current period."),
Q("What is true of variable cost per unit?","It is constant",["It rises with activity","It falls with activity","It is always zero"],"Total variable cost changes with activity, but the cost per unit stays the same."),
Q("Activity rises. What happens to fixed cost per unit?","It falls",["It rises","It stays the same","It becomes variable"],"Total fixed cost does not change, so the cost per unit moves inversely to activity."),
Q("A mixed cost is a cost that…","Has both variable and fixed elements",["Is only variable","Is only fixed","Is both product and period"],"Mixed costs contain both variable and fixed cost elements."),
Q("Prime costs consist of…","Direct materials + direct labour",["Direct labour + overhead","Direct materials + overhead","All manufacturing costs"],"Prime costs are the main production costs: DM + DL. Direct costs are also called prime costs."),
Q("Conversion costs consist of…","Direct labour + manufacturing overhead",["Direct materials + direct labour","Direct materials + overhead","Selling + administration"],"Conversion costs turn raw materials into finished goods: DL + overhead."),
Q("An indirect cost is one that…","Cannot be traced to a cost object",["Can be traced to the product","Is always fixed","Is always non-manufacturing"],"Indirect costs cannot be traced to a cost object. They can be manufacturing or non-manufacturing."),
Q("Where are period costs reported?","Statement of Profit or Loss",["Statement of Cost of Goods Manufactured","Only in the balance sheet","They are not reported"],"Period costs (selling and administration) go to the Statement of Profit or Loss."),
Q("Where are product costs reported?","Statement of Cost of Goods Manufactured",["Statement of Profit or Loss only","Statement of cash flow only","They are not reported"],"Product costs are also known as manufacturing costs."),
Q("Wages of assembly line workers are…","Direct labour cost",["Manufacturing overhead","A period cost","Indirect labour"],"Wages of employees directly converting materials into finished goods are direct labour."),
Q("Selling expenses and administration expenses are also called…","Non-manufacturing costs",["Prime costs","Conversion costs","Product costs"],"They are non-manufacturing costs, also known as period costs.")];
const R=`<div class="ref"><table><tr><td>Factory equipment rent</td><td>1,500</td></tr><tr><td>Factory building insurance</td><td>500</td></tr><tr><td>Direct materials</td><td>200,000</td></tr><tr><td>Factory utilities</td><td>800</td></tr><tr><td>Office supplies</td><td>400</td></tr><tr><td>Assembly line wages</td><td>70,000</td></tr><tr><td>Depreciation, office equipment</td><td>400</td></tr><tr><td>Indirect materials</td><td>10,000</td></tr><tr><td>Factory property taxes</td><td>125</td></tr><tr><td>Factory supervisory salaries</td><td>1,700</td></tr><tr><td>Advertising</td><td>1,250</td></tr><tr><td>Sales commission</td><td>80,000</td></tr><tr><td>Depreciation, factory building</td><td>900</td></tr></table></div>`;
const K=(t,a,o,w)=>Q(`${t}${R}`,fmt(a),o.map(fmt),w);
const L4=[
K("<b>Boss round.</b> Calculate the prime costs.",270000,[200000,285525,85525],"Prime costs = direct materials 200,000 + assembly line wages 70,000 = 270,000."),
K("Calculate the manufacturing overhead.",15525,[16525,10000,85525],"Rent 1,500 + insurance 500 + utilities 800 + indirect materials 10,000 + taxes 125 + supervisors 1,700 + depreciation 900 = 15,525."),
K("Calculate the conversion costs.",85525,[270000,15525,285525],"Conversion = direct labour 70,000 + overhead 15,525 = 85,525."),
K("Calculate the total manufacturing costs.",285525,[270000,367575,85525],"200,000 + 70,000 + 15,525 = 285,525."),
K("Calculate the non-manufacturing costs.",82050,[81650,285525,80000],"Office supplies 400 + office depreciation 400 + advertising 1,250 + sales commission 80,000 = 82,050."),
K("Which total is reported in the Statement of Profit or Loss as period costs?",82050,[285525,15525,1650],"Period costs = non-manufacturing costs = 82,050.")];
const LV=[
{t:"Sort the cost",d:"Classify 13 costs: materials, labour, overhead or non-manufacturing",q:L1},
{t:"Product or period",d:"Where does each cost end up in the statements?",q:L2},
{t:"Concept check",d:"Costs vs expenses, behaviour, prime and conversion",q:sh(L3)},
{t:"Boss round",d:"Calculate prime, overhead, conversion and totals",q:L4}];
const CREDIT=`<div class="credit"><strong>Credits &amp; Acknowledgement</strong>Created by: <span>MUHAMMAD ADAM MUKHRIZ BIN REDZUAN</span>Lecturer: <span>PN. NORHAFIZAH BINTI HASHIM</span></div>`;
let S={best:[0,0,0,0]};
try{const b=JSON.parse(localStorage.getItem("cf-best")||"null");if(b)S.best=b}catch(e){}
function home(){
$("#app").innerHTML=`<h1>Cost Factory</h1><p class="sub">Topic 2: Cost concept, classification and component. Beat each shift to earn up to 3 stars. You have 3 lives per shift.</p>`+LV.map((l,i)=>`<button class="lv" data-i="${i}"><span class="n">${i+1}</span><div><b>${l.t}</b><small>${l.d}</small><br><small>${"★".repeat(S.best[i])+"☆".repeat(3-S.best[i])}</small></div></button>`).join("")+CREDIT;
document.querySelectorAll(".lv").forEach(b=>b.onclick=()=>start(+b.dataset.i))}
function start(i){const l=LV[i];S.i=i;S.qs=i==0||i==1?sh(l.q):l.q;if(i==3)S.qs=l.q;S.n=0;S.pts=0;S.lives=3;S.streak=0;S.ok=0;show()}
function show(){
const q=S.qs[S.n],tot=S.qs.length;
$("#app").innerHTML=`<div class="bar"><span>Shift ${S.i+1}: ${LV[S.i].t}</span><span>${"♥".repeat(S.lives)}${"♡".repeat(3-S.lives)}</span></div><div class="prog"><i style="width:${S.n/tot*100}%"></i></div><div class="bar"><span>${S.n+1} of ${tot}</span><span>${S.pts} pts${S.streak>1?" · streak ×"+S.streak:""}</span></div><div class="belt">${q.q}</div><div class="opts" id="o"></div><div id="f"></div>`;
sh(q.o).forEach(t=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>pick(b,t,q);$("#o").appendChild(b)})}
function pick(b,t,q){
const good=t===q.a;
document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add("ok")});
if(good){S.streak++;S.ok++;S.pts+=100+Math.min(S.streak-1,5)*20}else{b.classList.add("no");S.streak=0;S.lives--}
const last=S.n+1>=S.qs.length||S.lives<=0;
$("#f").innerHTML=`<div class="fb ${good?"ok":"no"}"><b>${good?"Correct.":"Not quite."}</b> ${q.w}</div><button class="go" id="nx">${last?"See results":"Next item"}</button>`;
$("#nx").onclick=()=>{if(last)end();else{S.n++;show()}};$("#nx").focus()}
function end(){
const tot=S.qs.length,won=S.lives>0&&S.n+1>=tot,acc=S.ok/tot;
const st=!won?0:acc>=.9?3:acc>=.75?2:1;
if(st>S.best[S.i]){S.best[S.i]=st;try{localStorage.setItem("cf-best",JSON.stringify(S.best))}catch(e){}}
const all=S.best.every(x=>x>0);
$("#app").innerHTML=`<h2>${won?"Shift complete":"Shift failed"}</h2><div class="big">${"★".repeat(st)+"☆".repeat(3-st)}</div><p class="sub">${S.ok} of ${tot} correct, ${S.pts} points.${won?"":" You ran out of lives. Review the explanations and try again."}${all?" You have cleared every shift. You are ready for Topic 3.":""}</p><button class="go" id="a">Play again</button>${S.i<3&&won?`<button class="go" id="b" style="background:var(--steel);color:#fff">Next shift</button>`:""}<button class="go" id="h" style="background:var(--card);color:var(--ink);border:2px solid var(--line)">Back to menu</button>`+CREDIT;
$("#a").onclick=()=>{LV[2].q=sh(L3);start(S.i)};if($("#b"))$("#b").onclick=()=>start(S.i+1);$("#h").onclick=home}
home();
</script></body></html>
